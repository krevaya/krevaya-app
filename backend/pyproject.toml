[project]
name = "krevaya-app"
version = "0.1.0"
description = "Server for Krevaya: accounts, design storage, live co-editing and the assistant API"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "pillow>=11.0",
    "pycrdt>=0.12",
    "itsdangerous>=2.2",
    "defusedxml>=0.7",
    "authlib>=1.3",
    "sqladmin>=0.20",
    "mcp>=1.2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
redis = ["redis>=5.2"]
export = ["playwright>=1.48"]
qr = ["segno>=1.6"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
