# Host nginx for running Krevaya straight on a server, no containers.
# Layout it expects:
#   /opt/krevaya-app                     checkout of the repo, .env at the top
#   /opt/krevaya-app/frontend/dist       output of `npm run build`
#   127.0.0.1:8000                       the API, started by ops/krevaya-app.service
# Put it in /etc/nginx/sites-available/krevaya-app, swap in your hostname, enable it,
# then `certbot --nginx -d krevaya.example.net` adds https. Afterward set
# SITE_URL=https://krevaya.example.net and COOKIE_SECURE=true in .env.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream krevaya_server {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name krevaya.example.net;

    root /opt/krevaya-app/frontend/dist;
    client_max_body_size 60m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               image/svg+xml application/wasm font/ttf font/otf;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # overwrite rather than append; the server reads the first address only
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://krevaya_server;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://krevaya_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # files on local disk; drop this block when uploads live in S3_BUCKET
    location /media/ {
        alias /opt/krevaya-app/backend/data/media/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src data:; style-src 'unsafe-inline'" always;
    }

    location = /mcp {
        proxy_pass http://krevaya_server;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /admin {
        proxy_pass http://krevaya_server;
    }

    location /admin/ {
        proxy_pass http://krevaya_server;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
